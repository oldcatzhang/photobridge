name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust & iOS Target
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prebuild Rust Crate for iOS
        run: |
          # 动态获取当前 macOS 与 iOS SDK 路径
          MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # 分离 Host 与 Target 编译器的 sysroot/sdk，避免跨平台混淆
          export CC_aarch64_apple_darwin="clang -isysroot $MACOS_SDK"
          export CFLAGS_aarch64_apple_darwin="-isysroot $MACOS_SDK"
          export CC_aarch64_apple_ios="clang -isysroot $IOS_SDK"
          export CFLAGS_aarch64_apple_ios="-isysroot $IOS_SDK"
          
          cargo build --release --target aarch64-apple-ios

      - name: Install Tools
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec apps/ios/project.yml

      - name: Build Archive (Unsigned)
        run: |
          # 仅保留纯净签名禁用参数，避免注入污染最终 dylib 的 LIBRARY_PATH
          xcodebuild -project apps/ios/PhotoBridge.xcodeproj \
            -scheme PhotoBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/PhotoBridge.xcarchive/Products/Applications/*.app Payload/
          zip -r PhotoBridge.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-IPA
          path: PhotoBridge.ipa
