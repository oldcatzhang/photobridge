name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust & iOS Target
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prebuild Rust Crate for iOS
        run: |
          # 1. 显式指定 macOS SDK 供主机端宏/脚本构建使用，同时构建目标 aarch64-apple-ios
          MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT="$MACOS_SDK"
          cargo build --release --target aarch64-apple-ios

      - name: Install Tools
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec apps/ios/project.yml

      - name: Build Archive (Unsigned)
        run: |
          # 2. 导出 macOS SDK 路径，覆盖 Xcode 传给内部 Rust 脚本的环境变量
          MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)
          
          # 通过 env -u 清理可能污染 Rust 构建的变量，并注入 macOS SDK
          xcodebuild -project apps/ios/PhotoBridge.xcodeproj \
            -scheme PhotoBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SDKROOT_macosx="$MACOS_SDK" \
            LIBRARY_PATH="$MACOS_SDK/usr/lib" \
            archive

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/PhotoBridge.xcarchive/Products/Applications/*.app Payload/
          zip -r PhotoBridge.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-IPA
          path: PhotoBridge.ipa
