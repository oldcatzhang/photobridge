name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 确保使用系统默认最新的完整 Xcode 工具链
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Rust & iOS Target
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Tools
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec apps/ios/project.yml

      - name: Build Archive (Unsigned)
        run: |
          # 清除可能被继承污染的 SDK 环境变量，并指定 macOS SDK 路径供 host 编译宏使用
          unset SDKROOT
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer

          xcodebuild -project apps/ios/PhotoBridge.xcodeproj \
            -scheme PhotoBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/PhotoBridge.xcarchive/Products/Applications/*.app Payload/
          zip -r PhotoBridge.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-IPA
          path: PhotoBridge.ipa
